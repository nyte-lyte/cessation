<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cessation</title>
    <link rel="icon" href="data:," />
    <!-- your global styles (if you still have a style.css at project root) -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
        <div id="fs-overlay">
            <svg id="icon-expand" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
            <svg id="icon-compress" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none">
                <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
            </svg>
        </div>
    </div>
    <script>
        const overlay = document.getElementById('fs-overlay');
        const container = document.getElementById('canvas-container');
        const iconExpand = document.getElementById('icon-expand');
        const iconCompress = document.getElementById('icon-compress');
        overlay.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                container.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });
        document.addEventListener('fullscreenchange', () => {
            const isFs = !!document.fullscreenElement;
            iconExpand.style.display = isFs ? 'none' : 'block';
            iconCompress.style.display = isFs ? 'block' : 'none';
        });
    </script>

    <!-- then load your main app logic as a module, which will fetch vertex.glsl & fragment.glsl -->
    <script type="module" src="src/main.js"></script>
</body>

</html>
